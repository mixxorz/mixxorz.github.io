<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Booking flow with an agent interface</title>
  <desc id="desc">A user talks to an LLM, which uses a purpose-built agent interface backed by the deterministic booking core.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b73" />
    </marker>
  </defs>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <path d="M 142 90 H 173" fill="none" stroke="#6b6b73" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />
    <path d="M 312 90 H 343" fill="none" stroke="#6b6b73" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />
    <path d="M 530 90 H 561" fill="none" stroke="#6b6b73" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />

    <g>
      <rect x="12" y="48" width="130" height="84" rx="8" fill="#f4f4f5" stroke="#d2d2d6" />
      <text x="77" y="83" fill="#17171a" font-size="18" font-weight="600">User</text>
      <text x="77" y="107" fill="#6b6b73" font-size="14">Customer</text>
    </g>

    <g>
      <rect x="182" y="48" width="130" height="84" rx="8" fill="#f4f4f5" stroke="#d2d2d6" />
      <text x="247" y="83" fill="#17171a" font-size="18" font-weight="600">LLM</text>
      <text x="247" y="107" fill="#6b6b73" font-size="14">Understands intent</text>
    </g>

    <g>
      <rect x="352" y="48" width="178" height="84" rx="8" fill="#ffffff" stroke="#1a4fa0" stroke-width="2" />
      <text x="441" y="83" fill="#17171a" font-size="17" font-weight="600">Agent interface</text>
      <text x="441" y="107" fill="#6b6b73" font-size="14">Purpose-built tools</text>
    </g>

    <g>
      <rect x="570" y="48" width="138" height="84" rx="8" fill="#f4f4f5" stroke="#d2d2d6" />
      <text x="639" y="83" fill="#17171a" font-size="18" font-weight="600">Core</text>
      <text x="639" y="107" fill="#6b6b73" font-size="14">Business rules</text>
    </g>
  </g>
</svg>
