<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Traditional booking flow</title>
  <desc id="desc">A user interacts with a user interface, which calls the deterministic booking core.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b73" />
    </marker>
  </defs>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <path d="M 170 90 H 276" fill="none" stroke="#6b6b73" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />
    <path d="M 460 90 H 561" fill="none" stroke="#6b6b73" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" />

    <g>
      <rect x="20" y="48" width="150" height="84" rx="8" fill="#f4f4f5" stroke="#d2d2d6" />
      <text x="95" y="83" fill="#17171a" font-size="18" font-weight="600">User</text>
      <text x="95" y="107" fill="#6b6b73" font-size="14">Customer</text>
    </g>

    <g>
      <rect x="285" y="48" width="175" height="84" rx="8" fill="#ffffff" stroke="#1a4fa0" stroke-width="2" />
      <text x="372.5" y="83" fill="#17171a" font-size="18" font-weight="600">User interface</text>
      <text x="372.5" y="107" fill="#6b6b73" font-size="14">Forms and flows</text>
    </g>

    <g>
      <rect x="570" y="48" width="130" height="84" rx="8" fill="#f4f4f5" stroke="#d2d2d6" />
      <text x="635" y="83" fill="#17171a" font-size="18" font-weight="600">Core</text>
      <text x="635" y="107" fill="#6b6b73" font-size="14">Business rules</text>
    </g>
  </g>
</svg>
